spring.datasource.url=jdbc:postgresql://localhost:5433/spring-ai
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-plateform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

logging.level.org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor=DEBUG