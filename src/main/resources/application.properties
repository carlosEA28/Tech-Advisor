spring.application.name=primeiro-projeto

spring.ai.google.genai.api-key=${GOOGLE_API_KEY}

spring.ai.google.genai.chat.model=gemini-3.8-flash

spring.datasource.url= jdbc:h2:file:./data/db/chatmemory;AUTO_SERVER-TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.ai.chat.memory.repository.jdbc.initialize-schema=always

logging.level.org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor=DEBUG